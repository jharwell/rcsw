name: Build and test

# Run:
#
# - Every month. Scheduling helps keep drift/issues with updates
#   to runners at bay.
# - On pushes to relevant paths.
# - On pushes of stable release tags (vX.Y.Z), which cut a GitHub release.
#
on:
  push:
    # Listing tags means branches must be listed too, or branch pushes stop
    # triggering. Path filters only apply to branch pushes; tag pushes always
    # run. The tag pattern only matches stable vX.Y.Z tags, so dev tags don't
    # trigger a release.
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/**"
      - "docs/**"

  schedule:
    - cron: '0 0 1 * *'

concurrency:
  group: ${{ github.ref }}
  # Never cancel a run on master/devel partway through: that could leave a
  # pushed tag without its release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/devel' }}

jobs:
# ---------------------------------------------------------------------------
# Job 1: POSIX parametric build
#
# Purpose: verify compilation across the axes that affect code generation.
# ptr_align and zalloc are runtime-behavior options tested in the test job;
# they are intentionally absent here to keep the matrix manageable.
# ---------------------------------------------------------------------------
  build-posix:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - release
          - debug

        libtype:
          - STATIC
          - SHARED

        build_mode:
          - monolithic
          - components

        er_plugin:
          - LOG4CL
          - SIMPLE
          - ZLOG

        ptr_align:
          - 4

        # Spot-check the other ptr_align values, with the other axes pinned to
        # keep the count low. ptr_align has to be a matrix axis for these to be
        # added as new jobs: otherwise each include matches the same existing
        # job, and each overwrites the previous one's ptr_align.
        include:
          - { build_type: release, libtype: STATIC, build_mode: components,
              er_plugin: LOG4CL, ptr_align: 1 }
          - { build_type: release, libtype: STATIC, build_mode: components,
              er_plugin: LOG4CL, ptr_align: 2 }

    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Configure and build
        shell: bash
        run: |
          MONOLITHIC=OFF
          if [ "${{ matrix.build_mode }}" = "monolithic" ]; then
            MONOLITHIC=ON
          fi

          clibra build --preset ${{ matrix.build_type }} \
            -DRCSW_BUILD_FOR=POSIX \
            -DRCSW_CONFIG_LIBTYPE=${{ matrix.libtype }} \
            -DRCSW_CONFIG_BUILD_MONOLITHIC=${MONOLITHIC} \
            -DRCSW_CONFIG_ER_PLUGIN=${{ matrix.er_plugin }} \
            -DRCSW_CONFIG_PTR_ALIGN=${{ matrix.ptr_align }} \
            -DRCSW_CONFIG_STDIO_PUTCHAR=putchar

# ---------------------------------------------------------------------------
# Job 2: POSIX component-exclusion build
#
# Purpose: verify each optional component can be cleanly disabled (which also
# disables the components that need it), and that the all-disabled
# configuration (core only) also builds cleanly.
# ---------------------------------------------------------------------------
  build-posix-components:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        disabled_component:
          - multiprocess
          - multithread
          - stdio
          - swbus
          - tool
          - ALL   # all optional components disabled; only core remains

    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Configure and build
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.disabled_component }}" = "ALL" ]; then
            EXTRA_FLAGS="\
              -DRCSW_CONFIG_MULTIPROCESS=OFF \
              -DRCSW_CONFIG_MULTITHREAD=OFF \
              -DRCSW_CONFIG_STDIO=OFF \
              -DRCSW_CONFIG_SWBUS=OFF \
              -DRCSW_CONFIG_TOOL=OFF"
          else
            COMPONENT=$(echo "${{ matrix.disabled_component }}" | tr '[:lower:]' '[:upper:]')
            EXTRA_FLAGS="-DRCSW_CONFIG_${COMPONENT}=OFF"
          fi

          clibra build --preset debug \
            -DRCSW_BUILD_FOR=POSIX \
            -DRCSW_CONFIG_LIBTYPE=STATIC \
            -DRCSW_CONFIG_BUILD_MONOLITHIC=OFF \
            -DRCSW_CONFIG_ER_PLUGIN=LOG4CL \
            -DRCSW_CONFIG_PTR_ALIGN=4 \
            ${EXTRA_FLAGS}

# ---------------------------------------------------------------------------
# Job 3: Baremetal build (stdlib and nostdlib in one job)
#
# Purpose: verify baremetal targets compile across build types, ptr_align,
# and stdlib presence. Previously split across two jobs for no reason.
# ---------------------------------------------------------------------------
  build-baremetal:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - release
          - debug

        ptr_align:
          - 1
          - 2
          - 4

        stdlib:
          - STDCXX
          - NONE

    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Configure and build
        shell: bash
        run: |
          STDLIB_FLAGS=-DLIBRA_STDLIB=${{ matrix.stdlib }}

          # LOG4CL requires data structures which aren't built on baremetal;
          # always use SIMPLE here.
          clibra build --preset ${{ matrix.build_type }} \
            -DRCSW_BUILD_FOR=BAREMETAL \
            -DRCSW_CONFIG_ER_PLUGIN=SIMPLE \
            -DRCSW_CONFIG_PTR_ALIGN=${{ matrix.ptr_align }} \
            -DRCSW_CONFIG_LIBTYPE=STATIC \
            ${STDLIB_FLAGS}

# ---------------------------------------------------------------------------
# Job 4: POSIX test (memcheck + coverage)
#
# Purpose: functional correctness and memory safety across runtime-behavior
# axes. Runs after all build jobs pass.
# ---------------------------------------------------------------------------
  test-posix:
    runs-on: ubuntu-latest
    needs:
      - build-posix
      - build-posix-components
      - build-baremetal
    container:
        image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - release
          - debug

        ptr_align:
          - 1
          - 4

        zalloc:
          - YES
          - NO

    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Test
        shell: bash
        run: |
          clibra test \
            --reconfigure \
            --preset ci-valgrind \
            -DRCSW_CONFIG_PTR_ALIGN=${{ matrix.ptr_align }} \
            -DRCSW_CONFIG_ZALLOC=${{ matrix.zalloc }}

      - name: Test under Memcheck
        shell: bash
        run: |
          clibra build \
            --reconfigure \
            --preset ci-valgrindn \
            -DRCSW_CONFIG_PTR_ALIGN=${{ matrix.ptr_align }} \
            -DRCSW_CONFIG_ZALLOC=${{ matrix.zalloc }}

          # --test-dir is required because ctest + memcheck don't resolve the
          # binary dir reliably as of CMake 3.31
          ctest --preset ci-valgrind --test-dir build -T memcheck

      - name: Test under ASAN
        shell: bash
        run: |
          clibra test \
            --reconfigure \
            --preset ci-asan \
            -DRCSW_CONFIG_PTR_ALIGN=${{ matrix.ptr_align }} \
            -DRCSW_CONFIG_ZALLOC=${{ matrix.zalloc }}

      - name: Generate coverage
        shell: bash
        run: |
          clibra build --preset ci-coverage \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DRCSW_CONFIG_PTR_ALIGN=${{ matrix.ptr_align }} \
            -DRCSW_CONFIG_ZALLOC=${{ matrix.zalloc }}

          clibra build --preset ci-coverage --target build-and-test
          clibra build --preset ci-coverage --target lcov-report

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: build/coverage/coverage.info

# ---------------------------------------------------------------------------
# Job 5: Install and consume
#
# Purpose: end-to-end validation of the installed package, one install per
# matrix entry:
#
# - core: no optional components.
# - <component>: one optional component, plus the ones it needs, so its install
#   must stand on its own.
# - monolithic: everything, plus the monolithic rcsw::rcsw library.
#
# Each is installed as both static and shared libraries; shared builds also
# catch functions missing RCSW_API, which are hidden.
#
# The checks themselves are the BATS suite in tests/integration/: install
# layout, find_package(), per-header compilation, and per-component link
# tests. Run it locally against any install the same way; see
# tests/integration/helpers.bash.
#
# Runs after build-posix since it depends on install correctness, not tests.
# ---------------------------------------------------------------------------
  test-install:
    runs-on: ubuntu-latest
    needs:
      - build-posix
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - multiprocess
          - multithread
          - stdio
          - swbus
          - tool
          - monolithic
        libtype:
          - STATIC
          - SHARED
    env:
      RCSW_PREFIX: /tmp/rcsw-install
      RCSW_ER_PLUGIN: LOG4CL
      OPTIONAL_COMPONENTS: multiprocess multithread stdio swbus tool

    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Select components
        shell: bash
        run: |
          # ENABLE: the optional components under test, plus the ones they
          # need (see the cmake_dependent_option() calls in
          # cmake/components.cmake). A component whose dependencies are off is
          # forced off, so they must be listed here.
          # RCSW_COMPONENTS: what the tests expect to be installed.
          # CONFIG_FLAGS: one RCSW_CONFIG_<X> per optional component, ON only
          # for the ones in ENABLE.
          TARGET="${{ matrix.target }}"
          MONOLITHIC=OFF
          case "${TARGET}" in
            monolithic) ENABLE="${OPTIONAL_COMPONENTS}"; MONOLITHIC=ON ;;
            core)       ENABLE="" ;;
            swbus)      ENABLE="multithread swbus" ;;
            *)          ENABLE="${TARGET}" ;;
          esac

          FLAGS=""
          for c in ${OPTIONAL_COMPONENTS}; do
            if [[ " ${ENABLE} " == *" ${c} "* ]]; then
              VALUE=ON
            else
              VALUE=OFF
            fi
            FLAGS="${FLAGS} -DRCSW_CONFIG_${c^^}=${VALUE}"
          done
          COMPONENTS="core ${ENABLE}"

          echo "CONFIG_FLAGS=${FLAGS}" >> $GITHUB_ENV
          echo "RCSW_COMPONENTS=${COMPONENTS}" >> $GITHUB_ENV
          echo "RCSW_MONOLITHIC=${MONOLITHIC}" >> $GITHUB_ENV
          echo "RCSW_SOURCE_DIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Build and install
        shell: bash
        run: |
          clibra install --preset debug \
            -DRCSW_BUILD_FOR=POSIX \
            -DRCSW_CONFIG_LIBTYPE=${{ matrix.libtype }} \
            -DRCSW_CONFIG_BUILD_MONOLITHIC=${RCSW_MONOLITHIC} \
            -DRCSW_CONFIG_ER_PLUGIN=${RCSW_ER_PLUGIN} \
            -DRCSW_CONFIG_PTR_ALIGN=4 \
            -DCMAKE_INSTALL_PREFIX=${RCSW_PREFIX} \
            ${CONFIG_FLAGS}

      - name: Integration tests
        shell: bash
        run: bats --print-output-on-failure tests/integration

# ---------------------------------------------------------------------------
# Static analysis
#
# Purpose: catch issues not caught by testing.
# ---------------------------------------------------------------------------
  analyze-code:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        TOOL:
          - clang-tidy

    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Analyze
        shell: bash
        run: |
          clibra analyze \
            --preset analyze \
            --reconfigure \
            --keep-going \
            -DRCSW_BUILD_FOR=POSIX \
            -DRCSW_CONFIG_LIBTYPE=STATIC \
            -DRCSW_CONFIG_BUILD_MONOLITHIC=OFF \
            -DRCSW_CONFIG_ER_PLUGIN=LOG4CL \
            -DRCSW_CONFIG_PTR_ALIGN=4 \
            ${{ matrix.TOOL }}

  analyze-formatting:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        TYPE:
          - clang
          - cmake
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Analyze
        shell: bash
        run: |
          clibra format --keep-going --reconfigure --check ${{ matrix.TYPE }} --preset format

  analyze-docs:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929
    strategy:
      fail-fast: false
      matrix:
        TOOL:
          - clang
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Analyze
        shell: bash
        run: |
          clibra docs check --kind ${{ matrix.TOOL }} --preset docs --reconfigure --keep-going

# ---------------------------------------------------------------------------
# Job 7: Docs
# ---------------------------------------------------------------------------
  docs:
    uses: ./.github/workflows/pages.yml
    needs:
      - test-posix
      - test-install
      - analyze-code
      - analyze-formatting
      - analyze-docs
    secrets: inherit

# ---------------------------------------------------------------------------
# Job 8: Tag development version (devel only)
#
# LIBRA derives the project version from git tags, so "bumping" the version
# is just pushing the next vX.Y.Z-dev.N tag. `clibra version --bump` computes
# it from the most recent tag:
#
#   vX.Y.Z        -> vX.Y.(Z+1)-dev.1
#   vX.Y.Z-dev.N  -> vX.Y.Z-dev.(N+1)
# ---------------------------------------------------------------------------
  tag-devel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    needs:
      - test-posix
      - test-install
      - analyze-code
      - analyze-formatting
      - analyze-docs
    permissions:
      contents: write
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # version resolution needs full history + tags

      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git config --global user.email "${{ github.event.pusher.email }}"
          git config --global user.name "${{ github.event.pusher.name }}"
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Bump and tag
        shell: bash
        run: |
          # Re-runs of this job on an already-tagged commit must not create a
          # second dev tag for the same commit.
          if EXISTING=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "HEAD is already tagged ${EXISTING}; nothing to do."
            exit 0
          fi

          # clibra reads the version from the configured build dir, so
          # configure first.
          NEXT_VERSION=$(clibra version --preset release --bump --reconfigure)

          git tag "v${NEXT_VERSION}" -m "Development release ${NEXT_VERSION}"
          git push origin "v${NEXT_VERSION}"

# ---------------------------------------------------------------------------
# Job 9: Create release (stable tag push)
#
# Triggered by pushing a vX.Y.Z tag on a master commit. The version is
# whatever the tag says; it doesn't have to follow the devel bump scheme.
# ---------------------------------------------------------------------------
  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - test-posix
      - test-install
      - analyze-code
      - analyze-formatting
      - analyze-docs
    permissions:
      contents: write
    container:
      image: jharwell/ubuntu24.04-rcsw:20260929

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # version resolution needs full history + tags

      - name: Setup
        shell: bash
        run: |
          git config --global --add safe.directory $PWD
          git config --global user.email "${{ github.event.pusher.email }}"
          git config --global user.name "${{ github.event.pusher.name }}"
          git submodule update --init --remote --recursive
          cargo install clibra

      - name: Verify tag is on master
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on master; refusing to release."
            exit 1
          fi

      - name: Build release package
        shell: bash
        run: |
          clibra build --preset release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPACK_PACKAGE_NAME=rcsw-opt

          clibra build --preset release --target package

      - name: Verify version
        shell: bash
        run: |
          # Make sure LIBRA resolved the same version as the pushed tag, so
          # the package version matches the release. This fails if another
          # tag on the same commit (e.g. a dev tag) won out.
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          clibra version --preset release --full --check "${RELEASE_VERSION}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

      - name: Lint packages
        shell: bash
        run: lintian build/*.deb

      - name: Generate changelog
        shell: bash
        run: |
          # Only consider stable tags, so the changelog covers everything
          # since the previous release rather than since the last dev tag.
          git-cliff --latest --strip header \
            --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            -o changelog

      - name: Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.RELEASE_VERSION }}
          body_path: changelog
          prerelease: false
          files: build/*.deb
