name: Release

# Triggered ONLY by pushing a stable version tag: vX.Y.Z.
#
# This is a SEPARATE workflow from ci.yml because `paths` (needed there for
# feature-branch CI) also filters tag pushes, which would silently skip
# releases. Tag-triggered releases therefore live on their own.
#
# Cutting a release (manual):
#   git checkout master && git pull
#   git tag -a v1.5.16 -m "Release v1.5.16"
#   git push origin v1.5.16
#

on:
  push:
    tags:
      # In GitHub's glob syntax `[0-9]*` is a digit followed by anything, so
      # the first pattern alone also matches dev tags (vX.Y.Z-dev.N). The
      # negated pattern excludes any tag with a pre-release suffix.
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-build:
    runs-on: ubuntu-latest
    container:
      image: jharwell/ubuntu24.04-rcsw:20261002
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - shell: bash
        run: |

          git config --global --add safe.directory $PWD
          git submodule update --init --remote --recursive
          cargo install clibra
          clibra docs build --preset docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/_build/

  docs-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: docs-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  github-release:
    runs-on: ubuntu-latest
    needs: docs-deploy

    permissions:
      contents: write   # create the GitHub release / attach assets

    steps:
      - name: Github release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The tag already exists (you pushed it) — reuse it.
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: false
